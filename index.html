<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiftLab">
<title>LiftLab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>LiftLab — Workout Tracker</title>
<style>
  :root{
    --bg:#0F1215; --card:#171B20; --raised:#1F252B; --line:rgba(255,255,255,.07);
    --ink:#F1F3F4; --ink2:#98A3AC; --ink3:#5E6A73;
    --brass:#F5A524; --brass-dim:rgba(245,165,36,.14);
    --chart-amber:#C98500; --chart-blue:#3987E5;
    --good:#2FB344; --good-dim:rgba(47,179,68,.14);
    --danger:#E5484D; --danger-dim:rgba(229,72,77,.12);
    --grid:#262C33; --r:14px;
  }
  html,body{background:var(--bg);margin:0;padding:0;}
  body{color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
  input,select{font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;width:100%;}
  input:focus,select:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:transparent;}
  textarea{font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;width:100%;resize:none;line-height:1.45;}
  textarea:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:transparent;}
  input[type=number]{font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  #app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
  #view{flex:1;padding:calc(18px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));}
  #app.noconsole #view{padding-bottom:24px;}

  /* type roles */
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);}
  h1.display{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:2px 0 0;text-wrap:balance;}
  h2.display{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .num{font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink2);} .tiny{font-size:12.5px;}

  /* header rows */
  .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none;}
  .iconbtn:active{background:var(--raised);}
  .iconbtn svg{width:20px;height:20px;}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;}
  .card.tap:active{background:var(--raised);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;}
  .tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .tile .u{font-size:12px;color:var(--ink2);margin-top:1px;}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
    border-radius:13px;font-weight:700;font-size:16px;}
  .btn.primary{background:var(--brass);color:#1A1205;}
  .btn.primary:active{filter:brightness(.92);}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);}
  .btn.ghost:active{background:var(--raised);}
  .btn.danger{background:var(--danger-dim);color:var(--danger);}
  .btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:11px;}
  .btn[disabled]{opacity:.4;pointer-events:none;}

  /* chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .chips.scroll::-webkit-scrollbar{display:none;}
  .chip{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;flex:none;}
  .chip.on{background:var(--brass-dim);border-color:var(--brass);color:var(--brass);}

  /* pick grids (builder) */
  .pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pick{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;}
  .pick .t{font-weight:700;font-size:15px;}
  .pick .d{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.35;}
  .pick.on{border-color:var(--brass);background:var(--brass-dim);}
  .pick.on .t{color:var(--brass);}
  .pickgrid.one{grid-template-columns:1fr;}

  /* exercise list rows */
  .exrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;width:100%;text-align:left;}
  .exrow:active{background:var(--raised);}
  .exrow .nm{font-weight:650;}
  .exrow .sub{font-size:12.5px;color:var(--ink2);margin-top:1px;}
  .exrow .right{margin-left:auto;text-align:right;flex:none;}
  .exrow.sel{border-color:var(--brass);}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink3);background:var(--raised);border-radius:6px;padding:2px 7px;}
  .addmark{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--ink3);flex:none;
    display:flex;align-items:center;justify-content:center;color:transparent;}
  .exrow.sel .addmark{background:var(--brass);border-color:var(--brass);color:#1A1205;}

  /* set rows in logger */
  .wex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px;}
  .wex .grp{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--brass);}
  .prevline{font-size:12.5px;color:var(--ink2);margin:4px 0 2px;font-variant-numeric:tabular-nums;}
  .rec{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--brass);
    background:var(--brass-dim);border-radius:8px;padding:3px 9px;margin:4px 0 10px;}
  .rec.neutral{color:var(--ink2);background:var(--raised);}
  .shead{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;font-size:11px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:0 2px 6px;}
  .shead div:nth-child(2),.shead div:nth-child(3){text-align:center;}
  .srow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px;}
  .shead.time{grid-template-columns:26px 1fr 46px;}
  .srow.time{grid-template-columns:26px 1fr 46px;}
  .shead.cardio{grid-template-columns:22px 1.15fr 1fr 44px;gap:6px;}
  .srow.cardio{grid-template-columns:22px 1.15fr 1fr 44px;gap:6px;}
  .srow .snum{font-size:13px;font-weight:700;color:var(--ink3);text-align:center;font-variant-numeric:tabular-nums;}
  .fld{display:flex;align-items:center;gap:4px;}
  .fld input{text-align:center;padding:10px 4px;min-width:0;font-weight:700;font-size:16px;}
  .tfld{display:flex;align-items:center;gap:3px;justify-content:center;}
  .tfld input{text-align:center;padding:10px 2px;min-width:0;width:100%;font-weight:700;font-size:16px;}
  .tfld .colon{font-weight:800;color:var(--ink2);flex:none;}
  .dfld{display:flex;align-items:center;gap:4px;}
  .dfld input{text-align:center;padding:10px 2px;min-width:0;width:100%;font-weight:700;font-size:16px;}
  .dfld .u{font-size:12px;color:var(--ink2);flex:none;}
  /* builder target (sets × reps/time) */
  .tgrow{display:flex;align-items:center;gap:4px;padding:2px 0 4px;}
  .tglbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);}
  .tstep{width:26px;height:28px;flex:none;border-radius:8px;background:var(--raised);border:1px solid var(--line);
    color:var(--ink2);font-size:15px;font-weight:700;line-height:1;}
  .tstep:active{background:var(--grid);}
  .tval{min-width:34px;text-align:center;font-weight:800;font-size:14px;}
  .tvalin{width:44px;min-width:0;padding:5px 2px;text-align:center;font-weight:800;font-size:14px;
    background:var(--raised);border:1px solid var(--line);border-radius:8px;}
  .rperow{display:flex;align-items:center;gap:5px;margin-top:10px;}
  .rpebtn{width:32px;height:30px;border-radius:9px;background:var(--raised);border:1px solid var(--line);
    color:var(--ink2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
  .rpebtn.on{background:var(--brass-dim);border-color:var(--brass);color:var(--brass);}
  .recrow{display:flex;align-items:center;gap:8px;margin:4px 0 10px;}
  .recrow .rec{margin:0;}
  .bump{flex:none;min-width:34px;height:30px;padding:0 9px;border-radius:9px;background:var(--raised);
    border:1px solid var(--line);color:var(--ink2);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
  .bump.up{background:var(--brass-dim);border-color:var(--brass);color:var(--brass);}
  .bump:disabled{opacity:.35;}
  .bump:active{filter:brightness(1.2);}
  .plateviz{overflow-x:auto;padding:2px 0;}
  .plateviz svg{display:block;width:100%;min-width:168px;height:auto;}
  .step{width:30px;height:42px;flex:none;border-radius:9px;background:var(--raised);border:1px solid var(--line);
    color:var(--ink2);font-size:18px;font-weight:700;line-height:1;}
  .step:active{background:var(--grid);}
  .ck{width:46px;height:42px;border-radius:10px;border:1.5px solid var(--ink3);color:transparent;
    display:flex;align-items:center;justify-content:center;}
  .ck svg{width:20px;height:20px;}
  .srow.done .ck{background:var(--good);border-color:var(--good);color:#08210D;}
  .srow.done input{color:var(--ink2);}
  .setbtns{display:flex;gap:8px;margin-top:4px;}
  .setbtns .btn{padding:9px;font-size:13.5px;}

  /* workout sticky header */
  #whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 78%,transparent);
    padding:12px 0 14px;display:flex;align-items:center;gap:10px;}
  #whead .mid{flex:1;min-width:0;}
  #whead .ttl{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #whead .sub{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;}

  /* tab bar */
  #tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;
    display:grid;grid-template-columns:repeat(4,1fr);background:rgba(15,18,21,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;
    color:var(--ink3);font-size:10.5px;font-weight:700;letter-spacing:.04em;}
  .tab svg{width:22px;height:22px;}
  .tab.on{color:var(--brass);}
  #app.workout #tabbar{display:none;}

  /* rest pill */
  #restpill{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:25;display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--brass);
    border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 8px 28px rgba(0,0,0,.5);}
  #app.workout #restpill{bottom:calc(18px + env(safe-area-inset-bottom));}
  #restpill .t{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--brass);}
  #restpill button{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);}
  #amrappill{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:25;display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--brass);
    border-radius:999px;padding:8px 12px 8px 8px;box-shadow:0 8px 28px rgba(0,0,0,.5);}
  #app.workout #amrappill{bottom:calc(18px + env(safe-area-inset-bottom));}
  #amrappill .t{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--brass);}
  #amrappill .rds{font-weight:800;font-size:15px;color:var(--ink);min-width:20px;text-align:center;}
  #amrappill .rds::after{content:' rds';font-size:11px;font-weight:600;color:var(--ink2);}
  #amrappill .rbtn{background:var(--brass);color:#1A1205;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:800;}
  #amrappill button:not(.rbtn){background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);}

  /* sheets */
  #sheetwrap{position:fixed;inset:0;z-index:40;}
  #sheetwrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s;}
  #sheet{position:absolute;bottom:0;left:50%;transform:translate(-50%,102%);width:100%;max-width:480px;
    max-height:88dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;
    border-radius:22px 22px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));
    transition:transform .26s cubic-bezier(.32,.72,.22,1);}
  #sheetwrap.open .backdrop{opacity:1;}
  #sheetwrap.open #sheet{transform:translate(-50%,0);}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--grid);margin:4px auto 14px;}
  @media (prefers-reduced-motion:reduce){#sheet,#sheetwrap .backdrop{transition:none;}}

  /* charts */
  .chart{position:relative;margin-top:6px;}
  .chart svg{display:block;width:100%;height:auto;}
  .chart .ctip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line);
    border-radius:9px;padding:6px 10px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;
    transform:translate(-50%,-110%);box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:3;}
  .chart .ctip .cv{font-weight:800;font-size:14px;}
  .chart-empty{color:var(--ink3);font-size:13px;text-align:center;padding:34px 0;}
  .seg{display:grid;grid-auto-flow:column;gap:4px;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:4px;}
  .seg button{padding:8px 6px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink2);}
  .seg button.on{background:var(--raised);color:var(--ink);}

  /* history + calendar */
  .mhead{margin:20px 0 10px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .caldow div{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--ink3);padding:2px 0 6px;}
  .cday{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2);border:1px solid transparent;min-height:38px;}
  .cday:active{background:var(--raised);}
  .cday.has{background:var(--raised);color:var(--ink);font-weight:700;}
  .cday.today{border-color:var(--brass);color:var(--brass);font-weight:800;}
  .cday .dots{display:flex;gap:3px;height:5px;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--brass);display:inline-block;}
  .dot.plan{background:none;border:1px solid var(--ink2);}
  input[type=date]{color-scheme:dark;min-width:0;}
  .prbadge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;
    color:var(--good);background:var(--good-dim);border-radius:7px;padding:2px 8px;}

  /* misc */
  .empty{color:var(--ink2);text-align:center;padding:40px 20px;font-size:14px;line-height:1.5;}
  .empty .big{font-size:34px;display:block;margin-bottom:8px;}
  #toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:60;background:var(--raised);border:1px solid var(--line);color:var(--ink);border-radius:999px;
    padding:9px 18px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink3);margin-bottom:6px;}
  .checks{display:flex;gap:8px;flex-wrap:wrap;}
  a{color:var(--brass);}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
</style>

<div id="app">
  <main id="view"></main>
  <nav id="tabbar" aria-label="Sections">
    <button class="tab on" data-action="tab" data-tab="home" id="tab-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      Home</button>
    <button class="tab" data-action="tab" data-tab="exercises" id="tab-exercises">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
      Exercises</button>
    <button class="tab" data-action="tab" data-tab="history" id="tab-history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2.5"/></svg>
      History</button>
    <button class="tab" data-action="tab" data-tab="body" id="tab-body">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3.5"/><path d="M4.5 20.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg>
      Body</button>
  </nav>
  <div id="restpill" hidden>
    <span class="t num" id="restt">1:30</span>
    <button data-action="rest-add">+30s</button>
    <button data-action="rest-stop" aria-label="Stop rest timer">✕</button>
  </div>
  <div id="amrappill" hidden>
    <button class="rbtn" data-action="amrap-round">+ Round</button>
    <span class="rds num" id="amrapr">0</span>
    <span class="t num" id="amrapt">10:00</span>
    <button data-action="amrap-stop" aria-label="Stop AMRAP timer">✕</button>
  </div>
</div>
<div id="sheetwrap" hidden>
  <div class="backdrop" data-action="close-sheet"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ============ exercise library ============ */
/* Lifts held in BOTH hands with a dumbbell each: logged weight is per hand,
   so volume counts it twice. Single-dumbbell / single-arm work is not listed. */
const PAIR_IDS=new Set(['db-bench','inc-db-press','db-fly','db-shoulder','arnold','lat-raise',
  'front-raise','rear-delt','db-curl','hammer-curl','incline-curl','wrist-curl',
  'bss','walking-lunge','reverse-lunge','step-up','farmers-carry','db-squat-thruster']);
const LIB=[
// [id, name, group, equipment, region U/L/F, patterns, bodyweightOnly]
['bb-bench','Barbell Bench Press','Chest','Barbell','U',['push']],
['inc-bb-bench','Incline Bench Press','Chest','Barbell','U',['push']],
['decline-bench','Decline Bench Press','Chest','Barbell','U',['push']],
['db-bench','Dumbbell Bench Press','Chest','Dumbbell','U',['push']],
['inc-db-press','Incline Dumbbell Press','Chest','Dumbbell','U',['push']],
['db-fly','Dumbbell Fly','Chest','Dumbbell','U',['push']],

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const unit=()=>state.settings.units==='kg'?'kg':'lb';
const dispW=lbs=>state.settings.units==='kg'?lbs/LBKG:lbs;            // canonical lbs -> display
const toCanon=d=>state.settings.units==='kg'?d*LBKG:d;                // display -> canonical lbs
const rnd=v=>Math.round(v*10)/10;
const fmtN=v=>{v=rnd(v);return (v%1===0)?String(v):v.toFixed(1);};
const fmtW=lbs=>fmtN(dispW(lbs))+' '+unit();
const roundInc=v=>{const s=state.settings.units==='kg'?1.25:2.5;return Math.round(v/s)*s;};

const fmtDate=iso=>new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDateY=iso=>new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const dkey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const fromDateInput=s=>new Date(s+'T12:00:00').toISOString();
const epley=(w,r)=>r>0?w*(1+r/30):0;
const fmtSec=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+'s';
const M_PER_MI=1609.344;
const distUnit=()=>state.settings.units==='kg'?'km':'mi';
const dispDist=m=>state.settings.units==='kg'?m/1000:m/M_PER_MI;   // meters -> display
const toCanonDist=d=>state.settings.units==='kg'?d*1000:d*M_PER_MI; // display -> meters
const fmtDist=m=>fmtN(dispDist(m))+' '+distUnit();
const exMode=ex=>ex&&ex.dist?'cardio':(ex&&ex.t?'time':'lift'); // logging layout
function setStr(ex,s){
  if(ex&&ex.dist){const p=[];if(s.d>0)p.push(fmtDist(s.d));if(s.r>0)p.push(fmtSec(s.r));return p.join(' / ')||'—';}
  if(ex&&ex.t)return (s.w>0?fmtN(dispW(s.w))+' × ':'')+fmtSec(s.r);
  return (s.w>0?fmtN(dispW(s.w)):'bw')+'×'+s.r;
}
const planCount=p=>p.sections?p.sections.reduce((a,s)=>a+s.exs.length,0):(p.exs||[]).length;
/* a section exercise is either a plain id (legacy) or {id,sets,r} with target sets/reps-or-time */
const exIdOf=x=>typeof x==='string'?x:x.id;
const exTgOf=x=>typeof x==='string'?null:x;
const cloneSecs=secs=>(secs||[]).map(s=>({kind:s.kind,
  exs:(s.exs||[]).map(x=>typeof x==='string'?x:Object.assign({},x))}));
function effTarget(x){ // target if set, else what the logger would default to
  const id=exIdOf(x),tg=exTgOf(x),ex=getEx(id),lp=ex?lastPerf(id):null;
  const sets=tg&&tg.sets?tg.sets:(lp?Math.min(Math.max(lp.sets.length,1),6):(ex&&ex.dist?1:3));
  const r=(tg&&tg.r!=null)?tg.r:(lp&&lp.sets[0]?lp.sets[0].r:(ex&&ex.dist?0:(ex&&ex.t?30:8)));
  return{sets,r};
}
const tgStr=x=>{const ex=getEx(exIdOf(x)),t=effTarget(x);
  if(!ex)return '';
  if(!t.r)return t.sets+' set'+(t.sets===1?'':'s');
  return t.sets+' × '+((ex.t||ex.dist)?fmtSec(t.r):t.r);};
function lastStr(e){
  const lp=lastPerf(e.id); if(!lp)return '';
  if(e.dist){const bd=Math.max(...lp.sets.map(s=>s.d||0));if(bd>0)return fmtDist(bd);
    const bt=Math.max(...lp.sets.map(s=>s.r||0));return bt>0?fmtSec(bt):'—';}
  const top=Math.max(...lp.sets.map(s=>s.w));
  if(top>0)return fmtW(top);
  const br=Math.max(...lp.sets.map(s=>s.r));
  return e.t?fmtSec(br):'bw×'+br;
}
const fmtVol=lbs=>{const v=dispW(lbs);return v>=10000?(v/1000).toFixed(1)+'k':fmtN(Math.round(v));};

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2000);}

function doneSets(en){return en.sets.filter(s=>s.done&&(s.w>0||s.r>0||s.d>0));}
function sortedWorkouts(){return state.workouts.slice().sort((a,b)=>b.date<a.date?-1:1);}
function lastPerf(exId){
  for(const w of sortedWorkouts()){
    if(state.active&&state.active.editing===w.id)continue; // don't compare an edit against itself
    const en=w.entries.find(e=>e.ex===exId);
    if(en){const s=doneSets(en); if(s.length)return{date:w.date,sets:s};}
  }
  return null;
}
function recommend(ex){
  const lp=lastPerf(ex.id);
  if(ex.dist){
    if(!lp)return{w:0,note:'First time — log your effort',cls:'neutral'};
    const bd=Math.max(...lp.sets.map(s=>s.d||0)),bt=Math.max(...lp.sets.map(s=>s.r||0));
    const p=[];if(bd>0)p.push(fmtDist(bd));if(bt>0)p.push(fmtSec(bt));
    return{w:0,note:p.length?'Beat '+p.join(' / '):'Log your effort',cls:''};
  }
  if(!lp)return{w:0,note:'First time — start light',cls:'neutral'};
  const top=Math.max(...lp.sets.map(s=>s.w));
  if(ex.t){const br=Math.max(...lp.sets.map(s=>s.r));
    return{w:top,note:'Beat '+fmtSec(br)+(top>0?' @ '+fmtW(top):''),cls:''};}
  if(top===0){const br=Math.max(...lp.sets.map(s=>s.r));
    return{w:0,note:'Beat '+br+' reps',cls:''};}
  // hold last session's load; moving up is a deliberate tap, never automatic
  const allHit=lp.sets.every(s=>s.r>=8);
  return allHit
    ? {w:top,note:'Last: '+fmtW(top)+' — hit every set',cls:'',ready:true}
    : {w:top,note:'Last: '+fmtW(top),cls:'neutral',ready:false};
}
/* smallest jump the gear actually allows */
function nextWeightStep(ex){
  if(ex&&ex.eq==='Barbell'){
    const ps=(state.settings.plates||[]).filter(p=>p>0);
    if(ps.length)return 2*Math.min(...ps); // a pair of the smallest plate
  }
  return toCanon(state.settings.units==='kg'?2.5:5);
}
function bestMetric(exId,fn,excludeId){
  let best=0;
  for(const w of state.workouts){ if(w.id===excludeId)continue;
    const en=w.entries.find(e=>e.ex===exId); if(!en)continue;
    for(const s of doneSets(en))best=Math.max(best,fn(s));
  }
  return best;
}
const bestEpley=(exId,excludeId)=>bestMetric(exId,s=>epley(s.w,s.r),excludeId);
function prevLine(exId){
  const lp=lastPerf(exId); if(!lp)return '';
  const ex=getEx(exId);
  const parts=lp.sets.map(s=>setStr(ex,s)).join(' · ');
  return 'Last ('+fmtDate(lp.date)+'): '+parts;
}

function assignGroups(structId,n,off){
  off=off||0; // letters continue across sections so pairs read A / B / C, never A A A
  if(structId==='superset')return Array.from({length:n},(_,i)=>String.fromCharCode(65+off+Math.floor(i/2))+(i%2+1));
  if(structId==='giant')return Array.from({length:n},(_,i)=>String.fromCharCode(65+off+Math.floor(i/3))+(i%3+1));
  if(structId==='circuit'||structId==='hiit'||structId==='emom'||structId==='amrap')return Array.from({length:n},()=> 'ROUND');
  return Array.from({length:n},()=> '');
}
function lettersUsed(kind,n){return kind==='superset'?Math.ceil(n/2):kind==='giant'?Math.ceil(n/3):0;}
/* one dumbbell in each hand: the logged weight is per hand, so it counts twice */
const entryVol=en=>{const ex=getEx(en.ex);
  if(!ex||ex.t||ex.dist)return 0; // timed & cardio work carries no lifted volume
  return doneSets(en).reduce((a,s)=>a+s.w*s.r*(ex.hands||1),0);};
const secKey=en=>en.sec?en.sec+'#'+(en.secIdx!=null?en.secIdx:0):'';
/* recomputed from the sets, so corrections to the volume rules apply to old workouts too */
const workoutVol=w=>(w.entries||[]).reduce((a,en)=>a+entryVol(en),0);
function entriesFromSections(secs){
  const entries=[];let off=0; // letters consumed so far, so pairs keep counting A / B / C
  for(const s of secs){
    const gs=assignGroups(s.kind,s.exs.length,off);
    const si=secs.indexOf(s);
    s.exs.forEach((x,i)=>{const en=makeEntry(exIdOf(x),gs[i],exTgOf(x));
      if(en){en.sec=s.kind;en.secIdx=si;entries.push(en);}});
    off+=lettersUsed(s.kind,s.exs.length);
  }
  return entries;
}
function buildWorkout(mode,dateStr){
  const b=UI.builder;

    const lastEn=state.active.entries[state.active.entries.length-1];
    for(const id of b.sel){const en=makeEntry(id,'');
      if(en){if(lastEn&&lastEn.sec)en.sec=lastEn.sec;state.active.entries.push(en);}}
    save();closeSheet();render();return;
  }
  const t=TYPES.find(x=>x.id===b.type)||TYPES[4];
  const secs=b.sections.filter(s=>s.exs.length);
  if(!secs.length){toast('Add at least one exercise');return;}
  const kinds=[...new Set(secs.map(s=>s.kind))];
  const name=t.name+(kinds.length===1&&kinds[0]!=='straight'?' · '+secName(kinds[0]):'');
  if(mode==='plan'){
    state.planned.push({id:'p'+Date.now(),date:fromDateInput(dateStr),name,type:t.id,
      sections:cloneSecs(secs)});
    state.planned.sort((a,c)=>a.date<c.date?-1:1);
    save();closeSheet();UI.tab='home';UI.mode=null;render();
    toast('Scheduled for '+fmtDate(fromDateInput(dateStr)));return;
  }
  state.active={id:'w'+Date.now(),date:mode==='past'?fromDateInput(dateStr):new Date().toISOString(),
    startedAt:Date.now(),past:mode==='past'||undefined,name,type:t.id,
    entries:entriesFromSections(secs)};
  save();closeSheet();UI.mode='workout';render();
}
function startPlanned(id){

  const secs=p.sections||[{kind:p.struct||'straight',exs:p.exs||[]}];
  state.planned=state.planned.filter(x=>x.id!==id);
  state.active={id:'w'+Date.now(),date:new Date().toISOString(),startedAt:Date.now(),

function makeEntry(exId,group,tg){
  const ex=getEx(exId); if(!ex)return null;
  const lp=lastPerf(exId),rec=recommend(ex);
  const n=(tg&&tg.sets)?tg.sets:(lp?Math.min(Math.max(lp.sets.length,1),6):(ex.dist?1:3));
  const sets=Array.from({length:n},(_,k)=>{const prev=lp&&lp.sets[k];
    return{w:ex.dist?0:(prev?prev.w:rec.w), // repeat last session set for set
      r:(tg&&tg.r!=null)?tg.r:(prev?prev.r:(ex.dist?0:(ex.t?30:8))),
      d:prev?(prev.d||0):0,done:false};});
  return{ex:exId,group:group||'',sets};
}

function finishWorkout(){
  const a=state.active;
  const kept=a.entries.filter(en=>doneSets(en).length);
  if(!kept.length){
    openSheet(`<div class="grab"></div><h2 class="display" style="margin-bottom:8px">No sets logged</h2>
      <p class="muted" style="margin:0 0 16px">Nothing was checked off. Discard this workout, or go back and log your sets.</p>
      <div class="stack"><button class="btn danger" data-action="discard">Discard workout</button>
      <button class="btn ghost" data-action="close-sheet">Keep going</button></div>`);
    return;
  }
  const vol=kept.reduce((acc,en)=>acc+entryVol(en),0);
  const prs=[];
  for(const en of kept){
    const ex=getEx(en.ex);if(!ex)continue;
    const fn=ex.dist?(s=>s.d||0):ex.t?(s=>s.r):(s=>epley(s.w,s.r));
    const before=bestMetric(en.ex,fn,a.editing);
    const now=Math.max(...doneSets(en).map(fn));
    if(before>0&&now>before)prs.push(ex.name);
  }
  const durMin=a.editing?(a.dur||null):(a.past?null:Math.max(1,Math.round((Date.now()-a.startedAt)/60000)));
  const nSets=kept.reduce((acc,en)=>acc+doneSets(en).length,0);
  a._pending={vol,prs,durMin};
  openSheet(`<div class="grab"></div>
    <div class="eyebrow">${a.editing?'Editing · saves to '+fmtDateY(a.date):a.past?'Logged for '+fmtDateY(a.date):'Nice work'}</div><h2 class="display" style="margin:4px 0 14px">${esc(a.name)}</h2>
    <div class="tiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="tile"><div class="v">${durMin==null?'—':durMin}</div><div class="u">minutes</div></div>
      <div class="tile"><div class="v">${nSets}</div><div class="u">sets</div></div>
      <div class="tile"><div class="v">${fmtVol(vol)}</div><div class="u">${unit()} volume</div></div>
    </div>
    ${prs.length?`<div class="card"><div class="eyebrow" style="color:var(--good);margin-bottom:6px">New PRs</div>
      ${prs.map(p=>`<div class="prbadge" style="margin:0 6px 6px 0">▲ ${esc(p)}</div>`).join('')}</div>`:''}
    <div class="stack">
      <button class="btn primary" data-action="save-workout">Save workout</button>
      <button class="btn ghost" data-action="close-sheet">Back to logging</button>
      <button class="btn danger" data-action="discard">Discard</button>
    </div>`);
}

/* ============ barbell plate calculator ============ */
function plateSolve(targetLb){
  const bar=state.settings.bar||0;
  const plates=(state.settings.plates||[]).slice().sort((a,b)=>b-a);
  if(targetLb<bar-1e-6)return{under:true,bar};
  let rem=(targetLb-bar)/2;const used=[];
  for(const p of plates)while(rem>=p-1e-6){used.push(p);rem-=p;}   // greedy is optimal for standard sets
  const loaded=used.reduce((a,p)=>a+p,0);
  return{bar,used,achieved:bar+loaded*2,short:rem*2};
}
function plateGraphic(r){
  const plates=r.used; // solver already returns largest -> smallest
  const owned=state.settings.plates.length?state.settings.plates:[45];
  const maxP=Math.max(...owned);
  const H=132,mid=58,labelY=118;
  const diam=p=>Math.max(0.38,Math.pow(p/maxP,0.35))*96;  // bigger plates stand taller
  const thick=p=>7+15*Math.pow(p/maxP,0.6);               // and sit thicker on the sleeve
  const collarW=15,gap=3.5,tipW=13;
  let x=collarW+7;
  // thin plates still need room for their label underneath, so keep a minimum pitch
  const items=plates.map(p=>{const w=thick(p),h=diam(p),it={p,x,w,h};x+=Math.max(w+gap,23);return it;});
  const W=Math.round(Math.max(168,x+tipW+10));
  const label=plates.length
    ? plates.map(p=>fmtN(dispW(p))).join(' + ')+' per side'
    : 'empty bar';
  return `<div class="plateviz">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar sleeve loaded with ${esc(label)}">
      <defs>
        <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4A535C"/><stop offset="0.5" stop-color="#767F88"/><stop offset="1" stop-color="#39414A"/>
        </linearGradient>
        <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2B3138"/><stop offset="0.5" stop-color="#3C444D"/><stop offset="1" stop-color="#232830"/>
        </linearGradient>
      </defs>
      <!-- shaft running back toward the middle of the bar -->
      <rect x="0" y="${mid-7}" width="${W-tipW-2}" height="14" rx="3" fill="url(#steel)"/>
      <!-- inside collar the plates load against -->
      <rect x="${collarW-9}" y="${mid-19}" width="9" height="38" rx="2.5" fill="url(#steel)" stroke="rgba(0,0,0,.35)"/>
      ${items.map(it=>`
        <rect x="${it.x.toFixed(1)}" y="${(mid-it.h/2).toFixed(1)}" width="${it.w.toFixed(1)}" height="${it.h.toFixed(1)}"
          rx="3.5" fill="url(#plate)" stroke="var(--brass)" stroke-width="1.4"/>
        <text x="${(it.x+it.w/2).toFixed(1)}" y="${labelY}" text-anchor="middle"
          font-size="12" font-weight="800" fill="var(--brass)"
          style="font-variant-numeric:tabular-nums">${fmtN(dispW(it.p))}</text>`).join('')}
      <!-- sleeve end -->
      <rect x="${W-tipW-2}" y="${mid-10}" width="${tipW}" height="20" rx="3" fill="url(#steel)"/>
      ${plates.length?'':`<text x="${W/2}" y="${labelY}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink3)">no plates needed</text>`}
    </svg></div>`;
}

/* ============ coaching export (readable report for Claude) ============ */
const isCardioEntry=(en,ex)=>!!(ex&&ex.dist)||en.sec==='cardio';
function setCounts(w){ // warmup / cardio / stretch sets are not progression sets
  let working=0,warmup=0,cardio=0;
  for(const en of w.entries){
    const ex=getEx(en.ex);const n=doneSets(en).length;if(!ex||!n)continue;
    if(en.sec==='warmup')warmup+=n;
    else if(isCardioEntry(en,ex))cardio+=n;
    else if(en.sec==='stretch')warmup+=n;
    else working+=n;
  }
  return{working,warmup,cardio};
}
function progMetric(ex,sets){ // report each exercise in the unit it is actually trained in
  if(ex.dist){
    const d=Math.max(...sets.map(s=>s.d||0));
    if(d>0)return{v:d,fmt:fmtDist};
    return{v:Math.max(...sets.map(s=>s.r||0)),fmt:fmtSec};
  }
  if(ex.t)return{v:Math.max(...sets.map(s=>s.r||0)),fmt:fmtSec};
  const w=Math.max(...sets.map(s=>s.w||0));
  if(w>0)return{v:w,fmt:fmtW};
  return{v:Math.max(...sets.map(s=>s.r||0)),fmt:v=>v+' reps'}; // bodyweight work progresses by reps
}
function workoutLines(w){ // one workout, rendered the same way everywhere it is exported
  const L=[],c=setCounts(w);
  L.push('### '+dkey(w.date)+' — '+w.name);
  const meta=[];
  if(w.dur)meta.push(w.dur+' min');
  meta.push(c.working+' working set'+(c.working===1?'':'s'));
  if(c.warmup)meta.push(c.warmup+' warmup');
  if(c.cardio)meta.push(c.cardio+' cardio');
  const wv=workoutVol(w); if(wv)meta.push(fmtVol(wv)+' '+unit()+' volume');
  L.push(meta.join(' · '));
  if(w.prs&&w.prs.length)L.push('PRs: '+w.prs.join(', '));
  let lastSec=null;
  for(const en of w.entries){
    const ex=getEx(en.ex);const s=doneSets(en);if(!ex||!s.length)continue;
    if(en.sec&&secKey(en)!==lastSec){L.push('');L.push('**'+(secName(en.sec)||en.sec)+'**');lastSec=secKey(en);}
    const tag=en.group&&en.group!=='ROUND'?en.group+' ':'';
    const extra=[];
    if(en.rpe)extra.push('RPE '+en.rpe);
    const rest=restOf(en);
    if(rest)extra.push((en.group&&en.group!=='ROUND'?'cycle':'set-to-set')+' ~'+fmtSec(rest));
    if((ex.hands||1)>1)extra.push('per hand, ×2 in volume');
    L.push('- '+tag+ex.name+': '+s.map(x=>setStr(ex,x)).join(', ')+(extra.length?' — '+extra.join(', '):''));
  }
  if(w.notes){L.push('');L.push('Notes: '+w.notes.replace(/\n/g,' / '));}
  return L;
}
function workoutReport(w){
  return ['# LiftLab — single workout','',
    'Exported '+fmtDateY(new Date().toISOString())+' · weights in '+unit()+' · distances in '+distUnit(),
    'Dumbbell lifts are logged per hand; volume counts both.',
    'Set-to-set is the gap between completed sets, so it includes the working set itself.','',
    ...workoutLines(w),''].join('\n');
}
function exerciseReport(exId){
  const ex=getEx(exId); if(!ex)return '';
  const hist=exHistory(exId);
  const L=['# LiftLab — '+ex.name,'',
    ex.m.join(' / ')+' · '+ex.eq+((ex.hands||1)>1?' · logged per hand':''),
    'Exported '+fmtDateY(new Date().toISOString())+' · weights in '+unit()+' · distances in '+distUnit(),
    hist.length+' session'+(hist.length===1?'':'s')+' logged',''];
  if(!hist.length){L.push('No sessions logged yet.');return L.join('\n');}
  const first=progMetric(ex,hist[0].sets),last=progMetric(ex,hist[hist.length-1].sets);
  const best=hist.reduce((b,h)=>{const m=progMetric(ex,h.sets);return m.v>b.v?m:b;},progMetric(ex,hist[0].sets));
  L.push('Best: '+best.fmt(best.v));
  L.push('First → latest: '+first.fmt(first.v)+' → '+last.fmt(last.v));
  L.push('','## Sessions','');
  for(const h of hist){
    const w=state.workouts.find(x=>dkey(x.date)===dkey(h.date)&&x.entries.some(e=>e.ex===exId));
    const en=w&&w.entries.find(e=>e.ex===exId);
    const extra=[];
    if(en&&en.rpe)extra.push('RPE '+en.rpe);
    const rest=en?restOf(en):0;
    if(rest)extra.push((en.group&&en.group!=='ROUND'?'cycle':'set-to-set')+' ~'+fmtSec(rest));
    L.push('- '+dkey(h.date)+': '+h.sets.map(s=>setStr(ex,s)).join(', ')+(extra.length?' — '+extra.join(', '):''));
  }
  return L.join('\n');
}
async function shareText(title,txt){ // native share on mobile, clipboard everywhere else
  if(navigator.share){try{await navigator.share({title,text:txt});return;}catch(_){return;}}
  try{await navigator.clipboard.writeText(txt);toast('Copied — paste it into Claude');}
  catch(_){toast('Could not copy on this browser');}
}
function restOf(en){ // median gap between completed sets, from their timestamps
  const ts=doneSets(en).map(s=>s.t).filter(Boolean).sort((a,b)=>a-b);
  if(ts.length<2)return 0;
  const gaps=[];for(let i=1;i<ts.length;i++)gaps.push(Math.round((ts[i]-ts[i-1])/1000));
  gaps.sort((a,b)=>a-b);
  const m=gaps[Math.floor(gaps.length/2)];
  return m>0&&m<1800?m:0; // ignore absurd gaps (phone put down mid-session)
}
function coachReport(days){
  const cutoff=days?Date.now()-days*864e5:0;
  const ws=state.workouts.filter(w=>new Date(w.date).getTime()>=cutoff)
    .sort((a,b)=>a.date<b.date?-1:1);
  const bw=state.bodyweight.filter(x=>new Date(x.date).getTime()>=cutoff)
    .sort((a,b)=>a.date<b.date?-1:1);
  const L=[];
  L.push('# LiftLab training log');
  L.push('');
  L.push('Exported '+fmtDateY(new Date().toISOString())+' · weights in '+unit()+' · distances in '+distUnit());
  L.push('Dumbbell lifts are logged per hand; volume counts both. Volume excludes timed and cardio work.');
  L.push('Set-to-set is the measured gap between completed sets, so it includes the working set; for a superset it is the pair cycle.');
  L.push('Range: '+(days?'last '+days+' days':'all time')+' · '+ws.length+' workout'+(ws.length===1?'':'s'));
  L.push('');
  if(bw.length){
    L.push('## Body weight');
    const cur=bw[bw.length-1],first=bw[0];
    L.push('Latest: '+fmtW(cur.w)+' ('+fmtDateY(cur.date)+')');
    if(bw.length>1)L.push('Change over range: '+(cur.w>first.w?'+':'')+fmtN(dispW(cur.w-first.w))+' '+unit()+' from '+fmtW(first.w));
    L.push('');
    L.push(bw.map(x=>dkey(x.date)+': '+fmtW(x.w)).join('  \n'));
    L.push('');
  }
  if(!ws.length){L.push('## Workouts');L.push('No workouts logged in this range.');return L.join('\n');}
  // per-exercise progression within range, measured in the unit that exercise is actually trained in
  const prog={};
  for(const w of ws)for(const en of w.entries){
    const ex=getEx(en.ex);const s=doneSets(en);if(!ex||!s.length)continue;
    const m=progMetric(ex,s),key=ex.name;
    (prog[key]=prog[key]||{n:0,first:null,last:null,fmt:m.fmt}).n++;
    if(prog[key].first===null)prog[key].first=m.v;
    prog[key].last=m.v;prog[key].fmt=m.fmt;
  }
  L.push('## Workouts');
  L.push('');
  for(const w of ws)L.push(...workoutLines(w),'');
  const keys=Object.keys(prog).sort();
  if(keys.length){
    L.push('## Progress in range (best set per exercise)');
    L.push('');
    for(const k of keys){const p=prog[k];
      const same=p.first===p.last;
      L.push('- '+k+': '+(same?p.fmt(p.last):p.fmt(p.first)+' → '+p.fmt(p.last))+' ('+p.n+' session'+(p.n===1?'':'s')+')');
    }
    L.push('');
  }
  const tk=dkey(new Date());
  const ahead=state.planned.filter(p=>dkey(p.date)>=tk).sort((a,b)=>a.date<b.date?-1:1);
  const overdue=state.planned.filter(p=>dkey(p.date)<tk).sort((a,b)=>a.date<b.date?-1:1);
  if(ahead.length){
    L.push('## Scheduled ahead');
    for(const p of ahead)L.push('- '+dkey(p.date)+': '+p.name+' ('+planCount(p)+' exercises)');
    L.push('');
  }
  if(overdue.length){
    L.push('## Planned but not completed');
    for(const p of overdue)L.push('- '+dkey(p.date)+': '+p.name+' ('+planCount(p)+' exercises)');
    L.push('');
  }
  return L.join('\n');
}

/* ============ chart engine (single-series line) ============ */
const CHARTS={};
function lineChart(id,data,color,unitLabel){
  if(!data.length)return `<div class="chart-empty">Log a few sessions and the trend shows up here.</div>`;
  const W=340,H=180,L=40,R=14,T=16,B=24;
  const vs=data.map(d=>d.v),xs=data.map(d=>d.t);
  let vmin=Math.min(...vs),vmax=Math.max(...vs);
  if(vmin===vmax){const p=Math.max(1,vmin*.06);vmin-=p;vmax+=p;}
  const pad=(vmax-vmin)*.14;vmin-=pad;vmax+=pad;
  if(vmin<0&&Math.min(...vs)>=0)vmin=0;
  const tmin=Math.min(...xs),tmax=Math.max(...xs);
  const X=t=>data.length===1?L+(W-L-R)/2:L+(t-tmin)/(tmax-tmin||1)*(W-L-R);
  const Y=v=>T+(1-(v-vmin)/(vmax-vmin))*(H-T-B);
  const pts=data.map(d=>[X(d.t),Y(d.v)]);
  let grid='';
  for(let i=0;i<3;i++){
    const v=vmin+(vmax-vmin)*(0.18+0.32*i),y=Y(v).toFixed(1);
    grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${L-6}" y="${+y+3.5}" text-anchor="end" font-size="10" fill="var(--ink3)" style="font-variant-numeric:tabular-nums">${fmtN(v)}</text>`;
  }
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last=pts[pts.length-1];
  const area=data.length>1?`<path d="${line}L${last[0].toFixed(1)} ${H-B}L${pts[0][0].toFixed(1)} ${H-B}Z" fill="url(#g-${id})" opacity="0.35"/>`:'';
  const xlab=`<text x="${pts[0][0].toFixed(1)}" y="${H-7}" font-size="10" fill="var(--ink3)" text-anchor="${data.length===1?'middle':'start'}">${fmtDate(new Date(tmin).toISOString())}</text>`+
    (data.length>1?`<text x="${last[0].toFixed(1)}" y="${H-7}" font-size="10" fill="var(--ink3)" text-anchor="end">${fmtDate(new Date(tmax).toISOString())}</text>`:'');
  CHARTS[id]={data,pts,W,unitLabel};
  return `<div class="chart" data-chartid="${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart, ${data.length} points">
      <defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity="0.7"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${grid}${area}
      ${data.length>1?`<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
      ${pts.length<=14?pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}" stroke="var(--card)" stroke-width="2"/>`).join(''):''}
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="${color}" stroke="var(--bg)" stroke-width="2"/>
      <line id="cl-${id}" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="cd-${id}" r="4.5" fill="${color}" stroke="var(--bg)" stroke-width="2" visibility="hidden"/>
      ${xlab}
    </svg>
    <div class="ctip" hidden></div>
  </div>`;
}
function chartHover(e){
  const wrap=e.target.closest('.chart'); if(!wrap)return;
  const c=CHARTS[wrap.dataset.chartid]; if(!c||c.data.length===0)return;
  const svg=wrap.querySelector('svg'),tip=wrap.querySelector('.ctip');
  const rect=svg.getBoundingClientRect();
  const xv=(e.clientX-rect.left)/rect.width*c.W;
  let bi=0,bd=1e9;
  c.pts.forEach((p,i)=>{const d=Math.abs(p[0]-xv);if(d<bd){bd=d;bi=i;}});
  const p=c.pts[bi],d=c.data[bi];
  const cl=svg.querySelector('[id^=cl-]'),cd=svg.querySelector('[id^=cd-]');
  cl.setAttribute('x1',p[0]);cl.setAttribute('x2',p[0]);cl.setAttribute('visibility','visible');
  cd.setAttribute('cx',p[0]);cd.setAttribute('cy',p[1]);cd.setAttribute('visibility','visible');
  tip.hidden=false;
  tip.innerHTML=`<div class="muted">${fmtDate(new Date(d.t).toISOString())}</div><div class="cv num">${fmtN(d.v)} ${c.unitLabel}</div>`;
  const px=p[0]/c.W*rect.width;
  tip.style.left=Math.max(46,Math.min(rect.width-46,px))+'px';
  tip.style.top=(p[1]/180*rect.height)+'px';
}
function chartLeave(e){
  const wrap=e.target.closest('.chart'); if(!wrap)return;
  wrap.querySelector('.ctip').hidden=true;
  wrap.querySelectorAll('[visibility]').forEach(el=>el.setAttribute('visibility','hidden'));
}

let amrapEnd=0,amrapRounds=0;
function amrapStart(min){
  if(!min||min<=0){toast('Enter a time cap');return;}
  amrapEnd=Date.now()+min*60000;amrapRounds=0;
  $('#amrapr').textContent='0';$('#amrappill').hidden=false;tickAmrap();

function tickAmrap(){
  if(!amrapEnd)return;
  const left=Math.ceil((amrapEnd-Date.now())/1000);
  if(left<=0){buzz([200,100,200,100,200]);amrapFinish();return;}
  $('#amrapt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}
function amrapFinish(){
  const n=amrapRounds;amrapEnd=0;$('#amrappill').hidden=true;
  timerNote('AMRAP complete',n+' round'+(n===1?'':'s'));updateWorkoutNote(true);
  if(state.active){
    const line='AMRAP: '+n+' round'+(n===1?'':'s');
    state.active.notes=(state.active.notes?state.active.notes.replace(/\nAMRAP: \d+ rounds?$/,'')+'\n':'')+line;
    save();if(UI.mode==='workout')render();
  }
  toast('Time! '+n+' round'+(n===1?'':'s'));
}

/* ============ screen wake lock + workout notification ============ */
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on){ if(!wakeLock&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen'); }
    else if(wakeLock){await wakeLock.release();wakeLock=null;}
  }catch(_){/* denied or unsupported — not worth surfacing */}
}

  if(document.visibilityState==='visible'&&state.active&&UI.mode==='workout')keepAwake(true);
});
async function askNotify(){
  if(!('Notification' in window))return false;
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  try{return (await Notification.requestPermission())==='granted';}catch(_){return false;}
}
let notifyAt=0;
async function updateWorkoutNote(force){
  if(!state.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  if(!state.active){clearWorkoutNote();return;}
  const now=Date.now();
  if(!force&&now-notifyAt<5000)return; // notifications are not a 1 Hz display
  notifyAt=now;
  const reg=await navigator.serviceWorker.getRegistration(); if(!reg)return;
  const bits=[elapsedStr()];
  if(restEnd){const left=Math.max(0,Math.ceil((restEnd-now)/1000));
    bits.push((restRepeat?'EMOM ':'Rest ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0'));}
  if(amrapEnd){const left=Math.max(0,Math.ceil((amrapEnd-now)/1000));
    bits.push('AMRAP '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' · '+amrapRounds+' rds');}
  try{await reg.showNotification(state.active.name,{
    body:bits.join('  ·  '),tag:'liftlab-workout',renotify:false,silent:true,
    icon:'icon-192.png',badge:'icon-192.png',requireInteraction:true});}catch(_){}
}
async function clearWorkoutNote(){
  try{const reg=await navigator.serviceWorker.getRegistration(); if(!reg)return;
    (await reg.getNotifications({tag:'liftlab-workout'})).forEach(n=>n.close());
    (await reg.getNotifications({tag:'liftlab-timer'})).forEach(n=>n.close());
  }catch(_){}
}
async function timerNote(title,body){ // fires even when the app is backgrounded
  if(!state.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  try{const reg=await navigator.serviceWorker.getRegistration(); if(!reg)return;
    await reg.showNotification(title,{body,tag:'liftlab-timer',icon:'icon-192.png',badge:'icon-192.png'});
  }catch(_){}
}

function setVal(ei,si,field,raw){
  const en=state.active&&state.active.entries[ei]; if(!en||!en.sets[si])return;
  const s=en.sets[si],v=parseFloat(raw);
  if(field==='w')s.w=isNaN(v)||v<0?0:toCanon(v);
  else if(field==='r')s.r=isNaN(v)||v<0?0:Math.round(v);
  else if(field==='dist')s.d=isNaN(v)||v<0?0:toCanonDist(v);
  else if(field==='rmin'||field==='rsec'){
    const row=document.getElementById(`srow-${ei}-${si}`);
    const mn=Math.max(0,parseInt((row.querySelector('[data-field=rmin]')||{}).value)||0);
    const sc=Math.max(0,parseInt((row.querySelector('[data-field=rsec]')||{}).value)||0);
    s.r=mn*60+sc;
  }
  save();
}

    const cur=dispW(s.w);let nv=Math.max(0,roundInc(cur+inc));
    s.w=toCanon(nv);save();
    document.querySelector(`#srow-${ei}-${si} [data-field=w]`).value=nv?fmtN(nv):'';},
  stepr:el=>{
    const{ei,si}=el.dataset,s=state.active.entries[ei].sets[si];
    s.r=Math.max(0,(s.r||0)+ +el.dataset.d);save();
    document.querySelector(`#srow-${ei}-${si} [data-field=r]`).value=s.r||'';},
  bump:el=>{
    const en=state.active.entries[el.dataset.ei],ex=getEx(en.ex); if(!ex)return;
    const step=nextWeightStep(ex)*(+el.dataset.d);
    const cur=Math.max(...en.sets.map(s=>s.w),0);
    const nv=Math.max(0,cur+step);
    en.sets.forEach(s=>{if(!s.done)s.w=nv;}); // completed sets keep what you actually lifted
    save();
    const y=window.scrollY;render();window.scrollTo(0,y);
    toast(nv>cur?'Moved up to '+fmtW(nv):'Dropped to '+fmtW(nv));},
  rpe:el=>{
    const en=state.active.entries[el.dataset.ei],v=+el.dataset.v;
    en.rpe=en.rpe===v?null:v;save();
    el.parentElement.querySelectorAll('.rpebtn').forEach(b=>{
      const on=+b.dataset.v===en.rpe;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});},
  done:el=>{
    const{ei,si}=el.dataset,s=state.active.entries[ei].sets[si];
    s.done=!s.done;
    if(s.done)s.t=Date.now(); else delete s.t; // timestamps let the export report real rest
    save();
    document.getElementById(`srow-${ei}-${si}`).classList.toggle('done',s.done);},
  'add-set':el=>{
    const en=state.active.entries[el.dataset.ei];
    const lastSet=en.sets[en.sets.length-1];
    en.sets.push({w:lastSet?lastSet.w:0,r:lastSet?lastSet.r:8,d:lastSet?(lastSet.d||0):0,done:false});
    save();render();},
  'rm-set':el=>{
    const en=state.active.entries[el.dataset.ei];
    if(en.sets.length>1){en.sets.pop();save();render();}},
  'rm-ex':el=>{state.active.entries.splice(el.dataset.ei,1);save();render();},
  rest:el=>startRest(+el.dataset.sec,el.dataset.rep),
  'rest-add':()=>{restEnd=(restEnd||Date.now())+30000;tickRest();},
  'rest-stop':()=>{restEnd=0;restRepeat=false;$('#restpill').hidden=true;},
  'amrap-open':()=>openSheet(amrapStartHTML()),
  'amrap-go':el=>{const m=el.dataset.min?+el.dataset.min:parseFloat(($('#amrap-custom')||{}).value);
    if(!m||m<=0){toast('Enter a time cap');return;}
    amrapStart(m);closeSheet();},
  'amrap-round':()=>{amrapRounds++;$('#amrapr').textContent=amrapRounds;},
  'amrap-stop':()=>amrapFinish(),
  finish:()=>finishWorkout(),
  discard:el=>{if(!armed(el))return;
    const wasEdit=state.active&&state.active.editing;
    state.active=null;save();closeSheet();UI.mode=null;UI.tab='home';render();
    toast(wasEdit?'Edit canceled — original kept':'Workout discarded');},
  'save-workout':()=>{
    const a=state.active,p=a._pending;delete a._pending;
    const wasEdit=a.editing;delete a.editing;
    a.entries=a.entries.filter(en=>doneSets(en).length);
    a.entries.forEach(en=>{en.sets=en.sets.filter(s=>s.done&&(s.w>0||s.r>0||s.d>0));});
    a.vol=p.vol;a.prs=p.prs;a.dur=p.durMin;delete a.startedAt;delete a.past;
    if(wasEdit){
      const i=state.workouts.findIndex(x=>x.id===wasEdit);
      if(i>=0)state.workouts[i]=a;else state.workouts.push(a);
    }else state.workouts.push(a);
    state.active=null;save();
    closeSheet();UI.mode=null;UI.tab='home';render();
    toast(wasEdit?'Workout updated':p.prs.length?'Saved — '+p.prs.length+' new PR'+(p.prs.length>1?'s!':'!'):'Workout saved');},
  'ex-open':el=>{UI.metric='top';openSheet(exDetailHTML(el.dataset.id),'exdetail:'+el.dataset.id);},
  metric:el=>{UI.metric=el.dataset.id;
    const id=(sheetKind||'').split(':')[1];if(id)$('#sheet').innerHTML=exDetailHTML(id);},
  exg:el=>{UI.exg=el.dataset.id;render();},
  'ex-add-custom':()=>openSheet(customFormHTML()),
  'save-custom':()=>{
    const name=$('#cf-name').value.trim();
    if(!name){toast('Give it a name');return;}
    const m=[...document.querySelectorAll('.cf-g:checked')].map(c=>c.value);
    if(!m.length){toast('Pick at least one muscle group');return;}
    const p=[];if($('#cf-push').checked)p.push('push');if($('#cf-pull').checked)p.push('pull');
    const isDist=$('#cf-dist').checked;
    state.custom.push({id:'c'+Date.now(),name,m,eq:isDist?'Cardio':$('#cf-eq').value,
      r:$('#cf-region').value,p,bw:$('#cf-bw').checked,t:$('#cf-t').checked||isDist,dist:isDist,
      hands:$('#cf-pair').checked?2:1});
    save();closeSheet();render();toast('Added '+name);},
  'del-custom':el=>{if(!armed(el))return;
    state.custom=state.custom.filter(e=>e.id!==el.dataset.id);
    save();closeSheet();render();toast('Deleted');},
  'w-open':el=>openSheet(workoutDetailHTML(el.dataset.id)),
  'w-edit':el=>{
    if(state.active){toast('Finish or discard your current workout first');return;}
    const w=state.workouts.find(x=>x.id===el.dataset.id); if(!w)return;
    state.active=JSON.parse(JSON.stringify(w));
    state.active.editing=w.id;
    state.active.startedAt=Date.now();
    save();closeSheet();UI.mode='workout';render();},
  'w-copy':el=>{
    const w=state.workouts.find(x=>x.id===el.dataset.id); if(!w)return;
    const secs=sectionsFromWorkout(w);
    if(!secs.length){toast('Those exercises no longer exist');return;}
    UI.builder={step:4,type:w.type||'full',sections:secs,cur:null,sel:[],q:'',eq:'',addMode:false,presetDate:''};
    openSheet(builderHTML());},
  'w-savetpl':el=>{
    const w=state.workouts.find(x=>x.id===el.dataset.id); if(!w)return;
    const secs=sectionsFromWorkout(w);
    if(!secs.length){toast('Those exercises no longer exist');return;}
    state.templates.push({id:'t'+Date.now(),name:w.name,type:w.type||'full',sections:secs});
    save();closeSheet();UI.tab='home';UI.mode=null;render();toast('Saved to your workouts');},
  'tpl-open':el=>openSheet(templateDetailHTML(el.dataset.id)),
  'tpl-start':el=>{
    if(state.active){toast('Finish or discard your current workout first');return;}
    startTemplate(el.dataset.id);},
  'tpl-sched':el=>openSheet(tplScheduleHTML(el.dataset.id)),
  'tpl-sched-day':el=>{
    const t=state.templates.find(x=>x.id===el.dataset.id); if(!t)return;
    const iso=fromDateInput(el.dataset.date);
    state.planned.push({id:'p'+Date.now(),date:iso,name:t.name,type:t.type,
      sections:cloneSecs(t.sections)});
    state.planned.sort((a,c)=>a.date<c.date?-1:1);
    save();closeSheet();render();toast('Scheduled for '+fmtDate(iso));},
  'tpl-sched-save':el=>{
    const t=state.templates.find(x=>x.id===el.dataset.id); if(!t)return;
    const v=$('#tpl-date').value; if(!v){toast('Pick a date first');return;}
    state.planned.push({id:'p'+Date.now(),date:fromDateInput(v),name:t.name,type:t.type,
      sections:cloneSecs(t.sections)});
    state.planned.sort((a,c)=>a.date<c.date?-1:1);
    save();closeSheet();UI.tab='home';UI.mode=null;render();
    toast('Scheduled for '+fmtDate(fromDateInput(v)));},
  'tpl-edit':el=>{
    const t=state.templates.find(x=>x.id===el.dataset.id); if(!t)return;
    UI.builder={step:2,type:t.type||'full',sections:cloneSecs(t.sections),
      cur:null,sel:[],q:'',eq:'',addMode:false,editTpl:t.id};
    openSheet(builderHTML());},
  'b-savetpl-edit':()=>{
    const b=UI.builder,secs=b.sections.filter(s=>s.exs.length);
    if(!secs.length){toast('Add at least one exercise');return;}
    const t=state.templates.find(x=>x.id===b.editTpl); if(!t){closeSheet();return;}
    t.type=b.type;t.sections=cloneSecs(secs);
    save();closeSheet();render();toast('Saved workout updated');},
  'b-savetpl':()=>saveTemplateFromBuilder(),
  'tpl-del':el=>{if(!armed(el))return;
    state.templates=state.templates.filter(t=>t.id!==el.dataset.id);
    save();closeSheet();render();toast('Saved workout removed');},
  'cal-prev':()=>{UI.cal.m--;if(UI.cal.m<0){UI.cal.m=11;UI.cal.y--;}render();},
  'cal-next':()=>{UI.cal.m++;if(UI.cal.m>11){UI.cal.m=0;UI.cal.y++;}render();},
  'cal-day':el=>openSheet(dayHTML(el.dataset.date)),
  'day-log':el=>{const d=el.dataset.date;openBuilder(false);UI.builder.presetDate=d;},
  'del-workout':el=>{if(!armed(el))return;
    state.workouts=state.workouts.filter(w=>w.id!==el.dataset.id);
    save();closeSheet();render();toast('Workout deleted');},
  'bw-save':()=>{
    const v=parseFloat($('#bw-in').value);
    if(isNaN(v)||v<=0){toast('Enter a weight first');return;}
    state.bodyweight.push({date:new Date().toISOString(),w:toCanon(v)});
    save();render();toast('Body weight logged');},
  'del-bw':el=>{state.bodyweight=state.bodyweight.filter(x=>x.date!==el.dataset.id);save();render();},
  units:el=>{state.settings.units=el.dataset.id;save();render();openSheet(settingsHTML(),'settings');},
  machines:el=>{state.settings.hideMachines=el.dataset.id==='hide';save();openSheet(settingsHTML(),'settings');},
  haptics:el=>{state.settings.haptics=el.dataset.id==='on';save();openSheet(settingsHTML(),'settings');
    if(state.settings.haptics)buzz(30);},
  notify:async el=>{
    const want=el.dataset.id==='on';
    if(want&&!(await askNotify())){toast('Notifications are blocked in your browser settings');return;}
    state.settings.notify=want;save();openSheet(settingsHTML(),'settings');
    if(want){updateWorkoutNote(true);toast(state.active?'Notification on':'Shows up once a workout starts');}
    else clearWorkoutNote();},
  export:()=>{
    const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='liftlab-backup-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},
  wipe:el=>{if(!armed(el))return;
    state=blank();save();closeSheet();render();toast('All data erased');},
  'plates-open':el=>{UI.calcW=+el.dataset.w||state.settings.bar;openSheet(plateSheetHTML());},
  'calc-step':el=>{
    const step=2*Math.min(...(state.settings.plates.length?state.settings.plates:[2.5]));
    UI.calcW=Math.max(0,(UI.calcW||0)+step*(+el.dataset.d));
    $('#sheet').innerHTML=plateSheetHTML();},
  'calc-bar':()=>{
    const v=parseFloat($('#bar-w').value);
    if(isNaN(v)||v<0){toast('Enter a bar weight');return;}
    state.settings.bar=toCanon(v);save();$('#sheet').innerHTML=plateSheetHTML();},
  'calc-plate':el=>{
    const p=+el.dataset.p,i=state.settings.plates.findIndex(x=>Math.abs(x-p)<0.01);
    if(i>=0)state.settings.plates.splice(i,1); else state.settings.plates.push(p);
    state.settings.plates.sort((a,b)=>b-a);save();$('#sheet').innerHTML=plateSheetHTML();},
  'coach-export':()=>{UI.expDays=28;openSheet(coachSheetHTML());},
  'w-share':el=>{const w=state.workouts.find(x=>x.id===el.dataset.id);
    if(w)shareText('LiftLab — '+w.name,workoutReport(w));},
  'ex-share':el=>{const ex=getEx(el.dataset.id);
    if(ex)shareText('LiftLab — '+ex.name,exerciseReport(el.dataset.id));},
  'exp-range':el=>{UI.expDays=+el.dataset.d;$('#sheet').innerHTML=coachSheetHTML();},
  'exp-copy':async()=>{
    const txt=coachReport(UI.expDays===undefined?28:UI.expDays);
    try{await navigator.clipboard.writeText(txt);toast('Copied — paste it into Claude');}
    catch(_){ // fallback for browsers without clipboard permission
      const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('Copied — paste it into Claude');}
      catch(e){toast('Could not copy — use Download instead');}
      ta.remove();
    }},
  'exp-share':async()=>{
    const txt=coachReport(UI.expDays===undefined?28:UI.expDays);
    try{await navigator.share({title:'LiftLab training log',text:txt});}
    catch(_){/* user dismissed the share sheet */}},
  'exp-file':()=>{
    const txt=coachReport(UI.expDays===undefined?28:UI.expDays);
    const blob=new Blob([txt],{type:'text/markdown'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='liftlab-log-'+new Date().toISOString().slice(0,10)+'.md';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},
};
function importFile(e){
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.workouts))throw 0;
      state=Object.assign(blank(),d);save();closeSheet();render();toast('Backup imported');
    }catch(_){toast('That file is not a LiftLab backup');}};
  rd.readAsText(f);
}

/* ============ wiring ============ */
/* light haptic on every control, a firmer one for timer starts */
const HEAVY_TAPS=new Set(['rest','amrap-go','amrap-round','done','finish','save-workout','plan-start','tpl-start']);
const buzz=ms=>{if(state.settings.haptics!==false&&navigator.vibrate)navigator.vibrate(ms);};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el||!ACT[el.dataset.action])return;
  buzz(HEAVY_TAPS.has(el.dataset.action)?30:12);
  ACT[el.dataset.action](el,e);
});
document.addEventListener('input',e=>{
  const el=e.target,f=el.dataset&&el.dataset.field;
  if(!f)return;
  if(f==='w'||f==='r'||f==='dist'||f==='rmin'||f==='rsec')setVal(el.dataset.ei,el.dataset.si,f,el.value);
  else if(f==='wnotes'){if(state.active){state.active.notes=el.value;save();}}
  else if(f==='tgsets'||f==='tgreps'||f==='tgmin'||f==='tgsec'){
    const si=+el.dataset.si,xi=+el.dataset.xi,t=ensureTg(si,xi);
    if(f==='tgsets'){const v=parseInt(el.value);if(!isNaN(v)&&v>=1)t.sets=Math.min(12,v);}
    else if(f==='tgreps'){const v=parseInt(el.value);if(!isNaN(v)&&v>=0)t.r=Math.min(100,v);}
    else{ // minutes and seconds combine into one target
      const mn=Math.max(0,parseInt(($('#tgv-'+si+'-'+xi+'-m')||{}).value)||0);
      const sc=Math.max(0,parseInt(($('#tgv-'+si+'-'+xi+'-sec')||{}).value)||0);
      t.r=mn*60+sc;
    }}
  else if(f==='rest'){const v=Math.round(parseFloat(el.value));
    if(!isNaN(v)&&v>=5&&v<=900){state.settings.rest[+el.dataset.i]=v;save();}}
  else if(f==='b-q'){UI.builder.q=el.value;const l=$('#pickerlist');if(l)l.innerHTML=pickerListHTML();}
  else if(f==='exq'){UI.exq=el.value;const l=$('#exlist');if(l)l.innerHTML=exListHTML();}
});
document.addEventListener('pointermove',chartHover);
document.addEventListener('pointerdown',chartHover);
document.addEventListener('pointerout',chartLeave);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetwrap').hidden)closeSheet();});

render();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
